name: Issue → PR (publicação)

on:
  issues:
    types: [opened, labeled]

jobs:
  create-pr:
    if: contains(github.event.issue.labels.*.name, 'publicação')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - uses: actions/checkout@v4

      - name: Parse issue form and write markdown file
        id: parse
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = require('path');

            const body = context.payload.issue.body || '';
            const labels = context.payload.issue.labels.map(l => l.name);
            const tipo = labels.includes('tipo:notícia') ? 'news' : 'post';

            // Parse issue-form sections: "### Heading\n\nvalue\n\n### Next..."
            const sections = {};
            const regex = /###\s+(.+?)\n+([\s\S]*?)(?=\n###\s|$)/g;
            let m;
            while ((m = regex.exec(body)) !== null) {
              sections[m[1].trim()] = m[2].trim();
            }
            const get = (key) => {
              const v = sections[key];
              return (!v || v === '_No response_') ? '' : v;
            };

            const titulo = get('Título');
            const data = get('Data');
            const resumo = get('Resumo');
            const conteudo = get('Conteúdo');

            if (!titulo || !data || !resumo || !conteudo) {
              core.setFailed('Campos obrigatórios ausentes: título, data, resumo ou conteúdo.');
              return;
            }
            if (!/^\d{4}-\d{2}-\d{2}$/.test(data)) {
              core.setFailed(`Data inválida: "${data}". Use o formato AAAA-MM-DD.`);
              return;
            }

            const slugify = (s) => s.toLowerCase()
              .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
              .replace(/[^a-z0-9]+/g, '-')
              .replace(/(^-|-$)/g, '');
            const slug = slugify(titulo);
            const filename = `${data}-${slug}.mdx`;

            const q = (s) => `"${s.replace(/\\/g, '\\\\').replace(/"/g, '\\"').replace(/\n/g, ' ').trim()}"`;

            let dir, fmLines;
            if (tipo === 'news') {
              dir = 'src/content/news/pt-br';
              const fonte = get('Fonte / órgão emissor');
              fmLines = [
                `title: ${q(titulo)}`,
                `date: ${data}`,
                `summary: ${q(resumo)}`,
              ];
              if (fonte) fmLines.push(`source: ${q(fonte)}`);
            } else {
              dir = 'src/content/posts/pt-br';
              const autoresRaw = get('Autores');
              const tagsRaw = get('Tags');

              const autores = autoresRaw.split('\n').map(l => l.trim()).filter(Boolean).map(line => {
                const match = line.match(/^(.+?)\s*[<(]([^>)]+)[>)]\s*$/);
                if (!match) {
                  core.setFailed(`Autor em formato inválido: "${line}". Use "Nome <email>".`);
                  return null;
                }
                return `  - name: ${q(match[1].trim())}\n    email: ${q(match[2].trim())}`;
              });
              if (autores.includes(null)) return;

              const tags = tagsRaw
                ? tagsRaw.split(',').map(t => t.trim()).filter(Boolean).map(q).join(', ')
                : '';

              fmLines = [
                `title: ${q(titulo)}`,
                `authors:`,
                ...autores,
                `date: ${data}`,
                `tags: [${tags}]`,
                `summary: ${q(resumo)}`,
              ];
            }

            const md = `---\n${fmLines.join('\n')}\n---\n\n${conteudo}\n`;
            fs.mkdirSync(dir, { recursive: true });
            const filepath = path.join(dir, filename);
            fs.writeFileSync(filepath, md);

            core.setOutput('tipo', tipo);
            core.setOutput('slug', slug);
            core.setOutput('filepath', filepath);
            core.setOutput('titulo', titulo);

      - name: Create pull request
        id: cpr
        uses: peter-evans/create-pull-request@v7
        with:
          commit-message: "${{ steps.parse.outputs.tipo }}: ${{ steps.parse.outputs.slug }}"
          branch: "publicacao/issue-${{ github.event.issue.number }}"
          delete-branch: true
          title: "[${{ steps.parse.outputs.tipo }}] ${{ steps.parse.outputs.titulo }}"
          body: |
            Gerado automaticamente a partir da issue #${{ github.event.issue.number }}.

            **Arquivo:** `${{ steps.parse.outputs.filepath }}`

            Revise o conteúdo e faça o merge para publicar.

            Closes #${{ github.event.issue.number }}
          labels: |
            publicação
            automated

      - name: Comment on issue with PR link
        if: steps.cpr.outputs.pull-request-url
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              issue_number: context.payload.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `✅ PR aberto: ${{ steps.cpr.outputs.pull-request-url }}\n\nAssim que o PR for aprovado e mergeado, a publicação será feita automaticamente no site.`
            });
