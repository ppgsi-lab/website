- name: "Gestão e Desenvolvimento de Sistemas"
  color: "teal"
  href: "/about/research/gestao-e-desenvolvimento"
  areas:
    - name: "Banco de Dados"
      description: "Big Data, NoSQL, Business Intelligence, Data Warehouse, Mineração de Dados, Data Provenance, Análise de Redes Sociais."
    - name: "Engenharia de Software"
      description: "Processos, técnicas e ferramentas para teste, depuração, arquitetura, manutenção e qualidade de artefatos de software."
    - name: "Gestão de TI"
      description: "Aspectos sociotécnicos e econômicos de SI. Governança, governo eletrônico, processos de negócio, economia da informação."
    - name: "Interação Humano-Computador"
      description: "Interfaces naturais, acessibilidade, UX, Realidade Virtual e Aumentada, avaliação de interfaces."
    - name: "Redes de Computadores"
      description: "Protocolos, desempenho, segurança e infraestrutura de redes aplicados a Sistemas de Informação."

- name: "Inteligência de Sistemas"
  color: "yellow"
  href: "/about/research/inteligencia-de-sistemas"
  areas:
    - name: "Inteligência Artificial"
      description: "Sistemas inteligentes que aprendem autonomamente — machine learning, PLN, robótica, bioinformática."
    - name: "Processamento Gráfico"
      description: "Modelos geométricos, visualização de dados, imagens médicas, Realidade Virtual, jogos, simulação."
    - name: "Reconhecimento de Padrões"
      description: "Abordagens estatísticas, inteligência computacional e linguagens formais para classificação e análise."
    - name: "Computação Sonora e Musical"
      description: "Recuperação de informação sonora e musical, personalização e imersão audiovisual, música digital."
