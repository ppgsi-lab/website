- id: "inteligencia-de-sistemas"
  name: "Inteligência de Sistemas"
  slug: "inteligencia-de-sistemas"
  color: "yellow"
  description: "Esta linha de pesquisa está relacionada ao estudo, à proposta, à aplicação e à avaliação de metodologias e técnicas da Computação no desenvolvimento de soluções algorítmicas avançadas e inovadoras para problemas de diversas áreas de aplicação."
  objective: "Propor novas abordagens para resolução de problemas, avaliar e aprimorar abordagens existentes, e inovar no uso de tais abordagens na criação de soluções avançadas que podem ser incorporadas como núcleos de processamento inteligente em Sistemas de Informação."
  areas:
    - name: "Inteligência Artificial"
      description: "Foco no projeto, desenvolvimento, aplicação e avaliação de métodos e técnicas para criação de sistemas inteligentes capazes de adquirir e integrar conhecimento, melhorando progressivamente seu desempenho em objetivos específicos. As bases teóricas incluem Estatística, Matemática Aplicada, Ciência da Computação e Engenharia. As aplicações abrangem bioinformática, biometria, economia, educação, linguística, saúde, análise de redes sociais, jogos e robótica."
    - name: "Processamento Gráfico"
      description: "Estudo de processos e técnicas computacionais envolvendo modelos geométricos e imagens digitais. Inclui a transformação de dados geométricos em imagens, conversão de imagens em diferentes formatos, apresentação visual eficiente de grandes volumes de informação, algoritmos para descoberta de estruturas em imagens, representação e manipulação de modelos 3D e técnicas de visualização em Realidade Virtual e Aumentada. As aplicações incluem sistemas de auxílio diagnóstico, plataformas de treinamento médico, jogos sérios para reabilitação, análise morfológica de organismos e reconhecimento de língua de sinais."
    - name: "Reconhecimento de Padrões"
      description: "Desenvolvimento de métodos para análise de características que descrevem objetos, categorizando-os em classes conhecidas ou grupos específicos. Os fundamentos teóricos envolvem três abordagens: Estatística (reconhecimento estatístico de padrões), Inteligência Computacional (paradigmas conexionistas, evolucionários e baseados em incerteza) e Linguagens Formais (reconhecimento sintático e estruturado de padrões). As aplicações incluem bioinformática, sistemas biométricos, auxílio diagnóstico por imagens médicas e sinais biológicos, processamento de linguagem natural, jogos e análise de redes sociais."
    - name: "Computação Sonora e Musical"
      description: "Área voltada à recuperação de informação sonora e musical, personalização e imersão audiovisual, e música digital. Envolve técnicas de processamento de sinais, aprendizado de máquina e interação humano-computador aplicadas a áudio, combinando análise computacional com aspectos perceptuais e culturais do som e da música."
