- id: "gestao-e-desenvolvimento"
  name: "Gestão e Desenvolvimento de Sistemas"
  slug: "gestao-e-desenvolvimento"
  color: "teal"
  description: "Esta linha de pesquisa está relacionada ao estudo, à proposta, à aplicação e à avaliação de metodologias e técnicas da Computação no contexto de desenvolvimento de Sistemas de Informação de valor estratégico para diversas áreas de aplicação."
  objective: "Propor novas abordagens e analisar sistematicamente abordagens já existentes, cobrindo processos de gestão relacionados a Sistemas de Informação, incluindo processos de negócio relacionados à Tecnologia da Informação."
  areas:
    - name: "Banco de Dados"
      description: "Motivada pela contínua expansão de dados em diversos setores, esta área foca na aquisição, organização e filtragem de dados, rastreamento, visualização e interação, mineração de dados e novos algoritmos para consultas e análises. Os dados requerem organização estruturada para descoberta de conhecimento, compreensão de fenômenos, melhoria de processos e descobertas científicas. As aplicações incluem bioinformática e saúde, ambientes corporativos e processos de negócio, redes sociais e governo eletrônico."
    - name: "Engenharia de Software"
      description: "Projetos de pesquisa voltados ao desenvolvimento de processos, técnicas e ferramentas para apoiar a análise e o desenvolvimento de artefatos de software — incluindo documentos de requisitos, diagramas e modelos, código-fonte e objeto, conjuntos de testes, frameworks, linhas de produto, interfaces de usuário e métricas. O objetivo é analisar e modificar artefatos para auxiliar teste, depuração, projeto arquitetural e manutenção, além de definir e experimentar processos e metodologias para maior qualidade e produtividade."
    - name: "Gestão de Tecnologia da Informação"
      description: "Foco nos aspectos sociotécnicos e econômicos de Sistemas de Informação, com o objetivo de criar soluções inovadoras para diferentes organizações. Investiga processos de negócio automatizados, terceirização e consultoria de TI, integrações e colaborações organizacionais, gestão de projetos de TI e SI, alinhamento estratégico negócio-TI, governança de TI, governo eletrônico, economia da informação, assimetrias informacionais e regulação econômica, e mercados de TI e informação."
    - name: "Interação Humano-Computador"
      description: "Visa definir, implementar e validar técnicas inovadoras de interação entre humanos e máquinas, melhorando a comunicação entre computadores e usuários. Os temas de pesquisa incluem Interfaces Naturais (corpo humano como meio de interação), Dispositivos Especializados (estereoscopia, feedback háptico), Avaliação de Interfaces Gráficas, Teste de Software para programas com saídas visuais e Ambientes Multidimensionais (espaços 2D e 3D, Realidade Virtual e Aumentada)."
    - name: "Redes de Computadores"
      description: "Pesquisa em protocolos, desempenho, segurança e infraestrutura de redes aplicados ao contexto de Sistemas de Informação. Abrange temas como computação em nuvem, redes definidas por software, segurança de redes e comunicação distribuída."
  advisors:
