- id: "inteligencia-de-sistemas"
  name:
    pt-br: "Inteligência de Sistemas"
    en: "Systems Intelligence"
    es: "Inteligencia de Sistemas"
  slug: "inteligencia-de-sistemas"
  description:
    pt-br: "Esta linha de pesquisa está relacionada ao estudo, à proposta, à aplicação e à avaliação de metodologias e técnicas da Computação no desenvolvimento de soluções algorítmicas avançadas e inovadoras para problemas de diversas áreas de aplicação."
    en: "This research line covers the study, proposal, application, and evaluation of computing methodologies and techniques in the development of advanced and innovative algorithmic solutions to problems in various application areas."
    es: "Esta línea de investigación está relacionada con el estudio, la propuesta, la aplicación y la evaluación de metodologías y técnicas de la computación en el desarrollo de soluciones algorítmicas avanzadas e innovadoras para problemas de diversas áreas de aplicación."
  objective:
    pt-br: "Propor novas abordagens para resolução de problemas, avaliar e aprimorar abordagens existentes, e inovar no uso de tais abordagens na criação de soluções avançadas que podem ser incorporadas como núcleos de processamento inteligente em Sistemas de Informação."
    en: "To propose new problem-solving approaches, evaluate and improve existing ones, and innovate in the use of these approaches to create advanced solutions that can be incorporated as intelligent processing cores in information systems."
    es: "Proponer nuevos enfoques para la resolución de problemas, evaluar y mejorar los enfoques existentes, e innovar en el uso de dichos enfoques en la creación de soluciones avanzadas que puedan incorporarse como núcleos de procesamiento inteligente en sistemas de información."
  areas:
    - name:
        pt-br: "Inteligência Artificial"
        en: "Artificial intelligence"
        es: "Inteligencia artificial"
      description:
        pt-br: "Foco no projeto, desenvolvimento, aplicação e avaliação de métodos e técnicas para criação de sistemas inteligentes capazes de adquirir e integrar conhecimento, melhorando progressivamente seu desempenho em objetivos específicos. As bases teóricas incluem Estatística, Matemática Aplicada, Ciência da Computação e Engenharia. As aplicações abrangem bioinformática, biometria, economia, educação, linguística, saúde, análise de redes sociais, jogos e robótica."
        en: "Focuses on the design, development, application, and evaluation of methods and techniques for creating intelligent systems that can acquire and integrate knowledge, progressively improving their performance on specific goals. Theoretical foundations include statistics, applied mathematics, computer science, and engineering. Applications cover bioinformatics, biometrics, economics, education, linguistics, health, social network analysis, games, and robotics."
        es: "Se centra en el diseño, desarrollo, aplicación y evaluación de métodos y técnicas para la creación de sistemas inteligentes capaces de adquirir e integrar conocimiento, mejorando progresivamente su desempeño en objetivos específicos. Las bases teóricas incluyen estadística, matemática aplicada, ciencias de la computación e ingeniería. Las aplicaciones abarcan bioinformática, biometría, economía, educación, lingüística, salud, análisis de redes sociales, juegos y robótica."
    - name:
        pt-br: "Processamento Gráfico"
        en: "Graphics processing"
        es: "Procesamiento gráfico"
      description:
        pt-br: "Estudo de processos e técnicas computacionais envolvendo modelos geométricos e imagens digitais. Inclui a transformação de dados geométricos em imagens, conversão de imagens em diferentes formatos, apresentação visual eficiente de grandes volumes de informação, algoritmos para descoberta de estruturas em imagens, representação e manipulação de modelos 3D e técnicas de visualização em Realidade Virtual e Aumentada. As aplicações incluem sistemas de auxílio diagnóstico, plataformas de treinamento médico, jogos sérios para reabilitação, análise morfológica de organismos e reconhecimento de língua de sinais."
        en: "Study of computational processes and techniques involving geometric models and digital images. It includes transforming geometric data into images, converting images between formats, efficient visual presentation of large volumes of information, algorithms for discovering structures in images, representation and manipulation of 3D models, and visualization techniques in virtual and augmented reality. Applications include computer-aided diagnosis systems, medical training platforms, serious games for rehabilitation, morphological analysis of organisms, and sign language recognition."
        es: "Estudio de procesos y técnicas computacionales que involucran modelos geométricos e imágenes digitales. Incluye la transformación de datos geométricos en imágenes, la conversión de imágenes a diferentes formatos, la presentación visual eficiente de grandes volúmenes de información, algoritmos para el descubrimiento de estructuras en imágenes, la representación y manipulación de modelos 3D y técnicas de visualización en realidad virtual y aumentada. Las aplicaciones incluyen sistemas de apoyo al diagnóstico, plataformas de entrenamiento médico, juegos serios para rehabilitación, análisis morfológico de organismos y reconocimiento de lengua de señas."
    - name:
        pt-br: "Reconhecimento de Padrões"
        en: "Pattern recognition"
        es: "Reconocimiento de patrones"
      description:
        pt-br: "Desenvolvimento de métodos para análise de características que descrevem objetos, categorizando-os em classes conhecidas ou grupos específicos. Os fundamentos teóricos envolvem três abordagens: Estatística (reconhecimento estatístico de padrões), Inteligência Computacional (paradigmas conexionistas, evolucionários e baseados em incerteza) e Linguagens Formais (reconhecimento sintático e estruturado de padrões). As aplicações incluem bioinformática, sistemas biométricos, auxílio diagnóstico por imagens médicas e sinais biológicos, processamento de linguagem natural, jogos e análise de redes sociais."
        en: "Development of methods for analyzing the features that describe objects, categorizing them into known classes or specific groups. The theoretical foundations involve three approaches: statistics (statistical pattern recognition), computational intelligence (connectionist, evolutionary, and uncertainty-based paradigms), and formal languages (syntactic and structural pattern recognition). Applications include bioinformatics, biometric systems, computer-aided diagnosis from medical images and biological signals, natural language processing, games, and social network analysis."
        es: "Desarrollo de métodos para el análisis de características que describen objetos, categorizándolos en clases conocidas o grupos específicos. Los fundamentos teóricos involucran tres enfoques: estadística (reconocimiento estadístico de patrones), inteligencia computacional (paradigmas conexionistas, evolutivos y basados en incertidumbre) y lenguajes formales (reconocimiento sintáctico y estructural de patrones). Las aplicaciones incluyen bioinformática, sistemas biométricos, apoyo al diagnóstico mediante imágenes médicas y señales biológicas, procesamiento de lenguaje natural, juegos y análisis de redes sociales."
    - name:
        pt-br: "Computação Sonora e Musical"
        en: "Sound and music computing"
        es: "Computación sonora y musical"
      description:
        pt-br: "Área voltada à recuperação de informação sonora e musical, personalização e imersão audiovisual, e música digital. Envolve técnicas de processamento de sinais, aprendizado de máquina e interação humano-computador aplicadas a áudio, combinando análise computacional com aspectos perceptuais e culturais do som e da música."
        en: "An area devoted to sound and music information retrieval, audiovisual personalization and immersion, and digital music. It involves signal processing, machine learning, and human-computer interaction techniques applied to audio, combining computational analysis with perceptual and cultural aspects of sound and music."
        es: "Área orientada a la recuperación de información sonora y musical, la personalización y la inmersión audiovisual, y la música digital. Involucra técnicas de procesamiento de señales, aprendizaje automático e interacción humano-computadora aplicadas al audio, combinando el análisis computacional con aspectos perceptuales y culturales del sonido y la música."
