cta:
  title:
    pt-br: "Pensando em se inscrever?"
    en: "Thinking about applying?"
    es: "¿Está pensando en inscribirse?"
  text:
    pt-br: "No mestrado, a seleção avalia histórico, currículo e uma intenção de pesquisa para cada projeto escolhido. A inscrição e o curso são gratuitos."
    en: "For the master's program, the selection process evaluates the academic transcript, CV, and one statement of research intent for each chosen project. The application and the program are free of charge."
    es: "En la maestría, la selección evalúa el historial académico, el currículum y una declaración de intención de investigación para cada proyecto elegido. La inscripción y el programa son gratuitos."

home:
  title:
    pt-br: "Inscrições abertas para o mestrado com ingresso em 2026/1"
    en: "Applications open for master's program entry in 2026/1"
    es: "Inscripciones abiertas para la maestría con ingreso en 2026/1"
  deck:
    pt-br: "O edital EACH/CPG 90/2025 recebe inscrições até 30 de novembro, em até três projetos de pesquisa. A seleção avalia histórico, currículo e intenções de pesquisa, e o resultado sai até 30 de dezembro."
    en: "Call EACH/CPG 90/2025 accepts applications until November 30, for up to three research projects. The selection process evaluates the academic transcript, CV, and statements of research intent, and results are released by December 30."
    es: "La convocatoria EACH/CPG 90/2025 recibe inscripciones hasta el 30 de noviembre, en hasta tres proyectos de investigación. La selección evalúa el historial académico, el currículum y las declaraciones de intención de investigación, y el resultado se publica a más tardar el 30 de diciembre."
  intro:
    pt-br: "O Programa de Pós-Graduação em Sistemas de Informação da EACH-USP forma mestres e doutores em Ciências capazes de integrar conceitos da computação às áreas de aplicação em que atuam. A área de concentração, Metodologia e Técnicas da Computação, propõe, desenvolve e avalia métodos nos principais campos da computação para resolver problemas complexos em saúde, educação, governo, economia, bioinformática, jogos e robótica."
    en: "The Graduate Program in Information Systems at EACH-USP trains Masters and Doctors of Science able to integrate computing concepts into the application areas in which they work. The area of concentration, Computing Methodology and Techniques, proposes, develops, and evaluates methods in the main fields of computing to solve complex problems in health, education, government, economics, bioinformatics, games, and robotics."
    es: "El Programa de Posgrado en Sistemas de Información de la EACH-USP forma magísteres y doctores en Ciencias capaces de integrar conceptos de la computación en las áreas de aplicación en las que actúan. El área de concentración, Metodología y Técnicas de la Computación, propone, desarrolla y evalúa métodos en los principales campos de la computación para resolver problemas complejos en salud, educación, gobierno, economía, bioinformática, juegos y robótica."
  imageAlt:
    pt-br: "Campus da EACH em Ermelino Matarazzo, São Paulo"
    en: "EACH campus in Ermelino Matarazzo, São Paulo"
    es: "Campus de la EACH en Ermelino Matarazzo, São Paulo"
