editais:
  title:
    pt-br: "Editais e resultados"
    en: "Calls and results"
    es: "Convocatorias y resultados"
  sub:
    pt-br: "Todos os processos seletivos de mestrado e doutorado, com edital, cronograma e documentos de cada etapa"
    en: "All master's and doctoral selection processes, with the call, schedule, and documents for each stage"
    es: "Todos los procesos de selección de maestría y doctorado, con la convocatoria, el cronograma y los documentos de cada etapa"
  ongoing:
    pt-br: "Em andamento"
    en: "Ongoing"
    es: "En curso"
  processTitle:
    pt-br: "Como funciona a seleção"
    en: "How the selection process works"
    es: "Cómo funciona la selección"
  processText:
    pt-br: "Mestrado, conforme o edital EACH/CPG 90/2025."
    en: "Master's program, as set out in call EACH/CPG 90/2025."
    es: "Maestría, según la convocatoria EACH/CPG 90/2025."
  steps:
    - title:
        pt-br: "Projetos e vagas"
        en: "Projects and openings"
        es: "Proyectos y vacantes"
      text:
        pt-br: "O programa divulga os projetos de pesquisa e as vagas de cada um."
        en: "The program publishes the research projects and the number of openings in each."
        es: "El programa publica los proyectos de investigación y las vacantes de cada uno."
    - title:
        pt-br: "Inscrição"
        en: "Application"
        es: "Inscripción"
      text:
        pt-br: "Em até três projetos, com histórico, Lattes, planilha de pontuação e uma intenção de pesquisa por projeto."
        en: "For up to three projects, with academic transcript, Lattes, scoring spreadsheet, and one statement of research intent per project."
        es: "En hasta tres proyectos, con historial académico, Lattes, planilla de puntuación y una declaración de intención de investigación por proyecto."
    - title:
        pt-br: "Homologação"
        en: "Approval of applications"
        es: "Aprobación de inscripciones"
      text:
        pt-br: "Lista de inscrições aceitas, com prazo para contestação."
        en: "List of accepted applications, with a deadline for appeals."
        es: "Lista de inscripciones aceptadas, con plazo para impugnación."
    - title:
        pt-br: "Primeira fase"
        en: "First stage"
        es: "Primera fase"
      text:
        pt-br: "Histórico, currículo e Poscomp ou SIN5013. Nota mínima 5."
        en: "Academic transcript, CV, and Poscomp or SIN5013. Minimum score 5."
        es: "Historial académico, currículum y Poscomp o SIN5013. Nota mínima 5."
    - title:
        pt-br: "Segunda fase"
        en: "Second stage"
        es: "Segunda fase"
      text:
        pt-br: "Intenções de pesquisa, avaliadas pela comissão e pelos docentes de cada projeto. Nota mínima 6."
        en: "Statements of research intent, evaluated by the committee and by the faculty members of each project. Minimum score 6."
        es: "Declaraciones de intención de investigación, evaluadas por la comisión y por los docentes de cada proyecto. Nota mínima 6."
    - title:
        pt-br: "Resultado"
        en: "Results"
        es: "Resultado"
      text:
        pt-br: "Classificação por projeto, com a data de matrícula."
        en: "Ranking by project, with the enrollment date."
        es: "Clasificación por proyecto, con la fecha de matrícula."
  doctorate:
    pt-br: "No doutorado, as inscrições são em fluxo contínuo e a seleção tem fase única: projeto de pesquisa, históricos, currículo, duas cartas de recomendação e Poscomp ou SIN5013. A inscrição exige carta de compromisso de um orientador credenciado."
    en: "For the doctoral program, applications are accepted on a rolling basis and selection has a single stage: research project, academic transcripts, CV, two letters of recommendation, and Poscomp or SIN5013. The application requires a letter of commitment from an accredited advisor."
    es: "En el doctorado, las inscripciones son en flujo continuo y la selección tiene una fase única: proyecto de investigación, historiales académicos, currículum, dos cartas de recomendación y Poscomp o SIN5013. La inscripción exige una carta de compromiso de un director de tesis acreditado."
  other:
    pt-br: "Candidatos de outros países e interessados em cursar disciplinas como aluno especial têm processos próprios: {international} e {special}."
    en: "Applicants from other countries and those interested in taking courses as special students have their own processes: {international} and {special}."
    es: "Los candidatos de otros países y los interesados en cursar asignaturas como estudiantes especiales tienen procesos propios: {international} y {special}."
