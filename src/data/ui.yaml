    pt-br: "Comissão Coordenadora do Programa"
    en: "Program Coordinating Committee"
    es: "Comisión Coordinadora del Programa"
  ccpText:
    pt-br: "A Comissão Coordenadora de Programa (CCP) é responsável pela gestão acadêmica do PPgSI."
    en: "The Program Coordinating Committee (CCP) is responsible for the academic management of PPgSI."
    es: "La Comisión Coordinadora del Programa (CCP) es responsable de la gestión académica del PPgSI."
  composition:
    pt-br: "Composição atual"
    en: "Current membership"
    es: "Composición actual"
  pastCoordinators:
    pt-br: "Ex-coordenadores"
    en: "Former coordinators"
    es: "Coordinadores anteriores"
  meetings:
    pt-br: "Calendário de reuniões"
    en: "Meeting calendar"
    es: "Calendario de reuniones"
  meetingsText:
    pt-br: "A CCP reúne-se ordinariamente nos meses de fevereiro, março, abril, maio, junho, agosto, setembro, outubro, novembro e dezembro. Não há reuniões ordinárias nos meses de janeiro e julho. As reuniões ordinárias são realizadas na primeira quarta-feira útil/letiva de cada mês."
    en: "The CCP holds regular meetings in February, March, April, May, June, August, September, October, November, and December. There are no regular meetings in January and July. Regular meetings are held on the first working/class Wednesday of each month."
    es: "La CCP se reúne en sesión ordinaria en los meses de febrero, marzo, abril, mayo, junio, agosto, septiembre, octubre, noviembre y diciembre. No hay reuniones ordinarias en los meses de enero y julio. Las reuniones ordinarias se realizan el primer miércoles hábil/lectivo de cada mes."
  important:
    pt-br: "Informação importante"
    en: "Important information"
    es: "Información importante"
  importantText:
    pt-br: "A pauta deve ser divulgada com no mínimo 48 horas úteis de antecedência. Documentação de docentes e alunos deve ser entregue até a segunda-feira anterior às 13h30, respeitando feriados e recessos. Casos excepcionais podem ser avaliados conforme justificativa apresentada. Para itens encaminhados à CPG após reunião da CCP, esta costuma se reunir na segunda quinta-feira de cada mês."
    en: "The agenda must be published at least 48 business hours in advance. Documents from faculty members and students must be submitted by 1:30 p.m. on the preceding Monday, taking holidays and recesses into account. Exceptional cases may be considered based on the justification provided. For items forwarded to the CPG after a CCP meeting, the CPG usually meets on the second Thursday of each month."
    es: "El orden del día debe publicarse con al menos 48 horas hábiles de anticipación. La documentación de docentes y estudiantes debe entregarse hasta el lunes anterior a las 13:30 h, teniendo en cuenta feriados y recesos. Los casos excepcionales pueden evaluarse según la justificación presentada. Para los asuntos remitidos a la CPG después de una reunión de la CCP, esta suele reunirse el segundo jueves de cada mes."

